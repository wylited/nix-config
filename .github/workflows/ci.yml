# Fleet CI: eval-only on every push/PR. Public repo → runners have no ssh
# keys, no tailscale, no GPU, no /etc/nix secrets, so we eval what is
# pure-evaluable:
#   - artificer-nixos, scout-darwin and warden toplevels (drvPath proof).
#     warden's pathExists guards in hosts/warden/default.nix no-op under pure
#     eval, so evaluation is fine; its real config touches live-host paths, so
#     we never BUILD it here (see README CI).
#   - nix flake check --no-build
name: ci
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  eval:
    name: eval ${{ matrix.host }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: artificer-nixos
            os: ubuntu-latest
            attr: nixosConfigurations.artificer-nixos.config.system.build.toplevel
          - host: scout-darwin
            os: macos-latest
            attr: darwinConfigurations.scout-darwin.config.system.build.toplevel
          - host: warden
            os: ubuntu-latest
            attr: nixosConfigurations.warden.config.system.build.toplevel
          - host: scout-asahi
            os: ubuntu-latest
            attr: nixosConfigurations.scout-asahi.config.system.build.toplevel
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v16
      # warden's caddy vhosts and ACME block are gated on pathExists of the
      # DNS-01 token file; without it CI evals a different (smaller) system
      # than the one deployed. Only the PATH is read at eval time, never the
      # value — leaving the file empty matches production shape.
      - name: warden eval needs the DNS-01 token path
        if: matrix.host == 'warden'
        run: sudo mkdir -p /etc/nix && sudo touch /etc/nix/acme-desec-env
      - name: eval toplevel drvPath
        run: nix eval --raw .#${{ matrix.attr }}.drvPath

  flake-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v16
      - run: nix flake check --no-build
