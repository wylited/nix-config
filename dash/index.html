<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#fafafa" />
    <title>dash</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23fafafa'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%23fa8d3e'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main>
      <header>
        <div class="head-left">
          <div class="brand"><span class="dot"></span>dash</div>
          <div class="weather" id="weather" hidden></div>
        </div>
        <div class="clock">
          <div id="time">--:--</div>
          <div id="date">&nbsp;</div>
        </div>
      </header>

      <section class="services">
        <h2>Services</h2>
        <nav class="tiles" id="services"></nav>
      </section>

      <section class="panel proxy">
        <div class="panel-head">
          <h2>Proxy</h2>
          <span class="muted" id="proxy-meta">—</span>
        </div>
        <div class="proxy-body">
          <div class="proxy-metric">
            <div class="proxy-label">Egress this month</div>
            <div class="proxy-value" id="proxy-egress">—</div>
            <div class="bar"><span id="proxy-bar"></span></div>
            <div class="muted" id="proxy-egress-note">1 GiB free · 17 GB billable budget</div>
          </div>
          <div class="proxy-metric">
            <div class="proxy-label">Delay</div>
            <div class="proxy-value" id="proxy-delay">—</div>
            <div class="muted" id="proxy-delay-note">ranger-in via mihomo</div>
          </div>
        </div>
      </section>

      <div class="columns">
        <section class="panel">
          <div class="panel-head">
            <h2>Upcoming</h2>
            <span class="muted" id="horizon"></span>
          </div>
          <ul class="events" id="events">
            <li class="empty">loading…</li>
          </ul>
          <button type="button" class="expand" id="events-expand" aria-expanded="false" hidden></button>
        </section>

        <section class="panel">
          <div class="panel-head">
            <h2>Todo</h2>
            <span class="muted" id="todo-meta"></span>
          </div>
          <ul class="tasks" id="tasks">
            <li class="empty">loading…</li>
          </ul>
          <button type="button" class="expand" id="tasks-expand" aria-expanded="false" hidden></button>
        </section>
      </div>

      <section class="panel inbox">
        <div class="panel-head">
          <h2>dsh inbox</h2>
          <div class="head-actions">
            <a href="https://ds.ts.wyli.tech/" target="_blank" rel="noreferrer">new tab</a>
            <button type="button" id="ask-toggle" aria-expanded="false" aria-controls="ask-body">open</button>
          </div>
        </div>
        <div id="ask-body" class="ask" hidden>
          <iframe
            id="ask-frame"
            title="dsh"
            data-src="https://ds.ts.wyli.tech/"
            loading="lazy"
            referrerpolicy="same-origin"
          ></iframe>
          <p class="muted hint">
            The real dsh composer, embedded. Ask, then close this panel; the session stays on
            <a href="https://ds.ts.wyli.tech/">ds.ts.wyli.tech</a>.
          </p>
        </div>
      </section>

      <footer>warden · tailnet</footer>
    </main>
    <script src="./app.js"></script>
  </body>
</html>
